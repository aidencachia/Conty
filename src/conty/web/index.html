<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101713" />
    <title>Conty</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Conty home">conty</a>
        <div class="connection" role="status">
          <span id="connection-dot" class="dot"></span
          ><span id="connection">Connecting</span>
        </div>
      </header>
      <main>
        <section id="pairing" class="pairing" aria-labelledby="pair-title">
          <h1 id="pair-title">Connect your browser</h1>
          <form id="pair-form" class="pair-card">
            <label for="code"
              >Enter the six-digit code shown on your computer.</label
            >
            <div class="code-row">
              <input
                id="code"
                name="code"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="000000"
                required
                aria-describedby="pair-message"
              />
              <button id="pair-submit" type="submit">Connect</button>
            </div>
            <p id="pair-message" class="form-message" role="status">
              The code is shown in the Conty terminal.
            </p>
          </form>
        </section>
        <section id="dashboard" hidden aria-labelledby="dashboard-title">
          <h1 id="dashboard-title" class="sr-only">Controls</h1>
          <nav id="pages" class="pages" aria-label="Dashboard pages"></nav>
          <p id="notice" class="notice" role="status" hidden></p>
          <div id="sections"></div>
          <details class="activity">
            <summary>Activity <span id="pending-count"></span></summary>
            <ol id="activity-list">
              <li class="empty-activity">No actions yet.</li>
            </ol>
          </details>
        </section>
      </main>
    </div>
  </body>
</html>
